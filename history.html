<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigitalBank | Bank Statement</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- THE FIX: Injecting AutoTable to generate multi-page, text-selectable, beautifully styled PDF tables! -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body style="background-color: #121212; color: white; font-family: Arial, sans-serif; padding-top: 30px; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh;">

    <nav class="top-nav" style="max-width: 800px;">
        <div style="display: flex; align-items: center; gap: 10px;">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent-gold);">
                <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                <polyline points="12 22 12 8"></polyline>
                <polyline points="9 11 12 8 15 11"></polyline>
            </svg>
            <div class="nav-logo" style="font-size: 1.3rem;">DigitalBank</div>
        </div>
        <!-- THE FIX: Wiring the Back button to dynamically route based on URL state -->
        <div class="nav-logout" style="cursor: pointer; font-size: 0.9rem;" onclick="goBack()">← Back to Vault</div>
    </nav>

    <div class="glass-panel" style="max-width: 800px; width: 95%; padding: 30px 20px;">
        
        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 15px; margin-bottom: 25px;">
            <h2 id="pageTitle" style="margin: 0; font-size: 1.5rem;">Bank Statement</h2>
            <!-- THE FIX: Wiring the button to trigger the new Mathematical PDF engine -->
            <button class="glass-btn secondary" style="width: auto; flex-shrink: 0; padding: 8px 15px; font-size: 0.85rem;" onclick="downloadPDF()">Download PDF ↓</button>
        </div>

        <div style="background: rgba(255,255,255,0.03); border: 1px solid var(--border-micro); border-radius: 12px; padding: 20px; margin-bottom: 30px; display: flex; flex-wrap: wrap; gap: 15px; align-items: flex-end;">
            <div class="input-group" style="flex: 1; min-width: 150px;">
                <label class="input-label">Start Date</label>
                <input type="date" id="startDate" class="glass-input" style="color-scheme: dark;">
            </div>
            <div class="input-group" style="flex: 1; min-width: 150px;">
                <label class="input-label">End Date</label>
                <input type="date" id="endDate" class="glass-input" style="color-scheme: dark;">
            </div>
            <button class="glass-btn" style="width: auto; padding: 14px 30px;" onclick="filterLedger()">Filter Ledger</button>
        </div>

        <div class="tx-list" id="fullLedger">
            <div class="tx-row" style="justify-content: center; color: #64748B;">
                Loading institutional history...
            </div>
        </div>

    </div>
    <div id="receiptModal" class="modal-overlay" style="display: none; z-index: 1000;">
        <div class="glass-panel" style="width: 400px; padding: 30px 20px;">
            <div class="receipt-container" id="receiptData" style="position: relative; margin-bottom: 20px;">
                <div class="receipt-header">
                    <div style="display: flex; justify-content: center; margin-bottom: 10px;">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#D4AF37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                            <polyline points="12 22 12 8"></polyline>
                            <polyline points="9 11 12 8 15 11"></polyline>
                        </svg>
                    </div>
                    <strong style="font-size: 1.2rem; color: white;">DIGITALBANK</strong><br>
                    <small style="color: var(--accent-gold);">Official Transaction Receipt</small>
                </div>
                <div class="receipt-row"><span>ID:</span> <span id="recId" style="color: white; font-family: monospace;"></span></div>
                <div class="receipt-row"><span>Date:</span> <span id="recDate"></span></div>
                <div class="receipt-row"><span>Sender:</span> <span id="recSender"></span></div>
                <div class="receipt-row"><span>To:</span> <span id="recName"></span></div>
                <div class="receipt-row"><span>Desc:</span> <span id="recDesc"></span></div>
                <div class="receipt-row" style="margin-top: 15px; font-weight: bold; font-size: 1.2rem; border-top: 1px dashed rgba(212, 175, 55, 0.3); padding-top: 15px;">
                    <span>Amount:</span> <span id="recAmt" style="color: #00ff88;"></span>
                </div>
            </div>

            <div class="btn-container">
                <button class="glass-btn secondary" onclick="closeReceiptSafe()">Close & Refresh</button>
                <button class="glass-btn" onclick="downloadReceiptSafe()">Download Image ↓</button>
            </div>
        </div>
    </div>

    <script>
        let userId = localStorage.getItem("digitalBankId");
        // THE FIX: Establishing the global memory container for the receipt logic to use
        let myAccountNumber = ""; 
        
        document.addEventListener("DOMContentLoaded", () => {
            if (!userId) window.location.assign("./index.html");

            // 1. Fetch the user's account number first
            fetch("http://206.189.113.64:8080/api/user", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ googleId: userId })
            })
            .then(res => res.json())
            .then(data => {
                // THE FIX: Locking the fetched account number into our global memory
                myAccountNumber = data.accountNumber;
                
                // THE FIX: Saving the true current balance to global memory so we can mathematically reverse-engineer historical balances!
                window.myCurrentBalance = data.balance; 
                
                // 2. Trigger the ledger fetch using their account number
                loadFullHistory(userId, data.accountNumber);
            })
            .catch(err => console.error("Could not fetch user data."));
        });

        // THE FIX: Global memory to hold the raw server data so we don't spam the Java backend on every filter
        let masterLedger = []; 

        function loadFullHistory(googleId, myAccountNumber) {
            fetch("http://206.189.113.64:8080/api/transactions", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ googleId: googleId })
            })
            .then(response => response.json())
            .then(transactions => {
                // THE FIX: Calculate rolling balances by mathematically reverse-engineering the timeline!
                let tempBal = window.myCurrentBalance || 0;
                transactions.forEach(tx => {
                    tx.runningBalance = tempBal;
                    if (tx.receiverAcc === myAccountNumber) {
                        tempBal -= tx.amount; // Reverse a deposit
                    } else if (tx.senderAcc === myAccountNumber) {
                        tempBal += tx.amount; // Reverse a withdrawal
                    }
                });

                // THE FIX: The URL Interceptor
                const urlParams = new URLSearchParams(window.location.search);
                const filterType = urlParams.get('filter');
                
                // If the URL contains "?filter=credit", isolate only the loan records
                if (filterType === 'credit') {
                    document.getElementById('pageTitle').innerText = "Institutional Credit History";
                    masterLedger = transactions.filter(tx => tx.description.includes("Credit"));
                } else {
                    masterLedger = transactions; // Normal behavior
                }
                
                renderLedgerRows(masterLedger); // Initial render of the filtered data
            })
            .catch(error => console.error("Ledger fetching failed:", error));
        }

        // THE FIX: The Mathematical Date Slicer
        function filterLedger() {
            let startVal = document.getElementById("startDate").value;
            let endVal = document.getElementById("endDate").value;
            
            if (!startVal || !endVal) return alert("Please select both a Start Date and an End Date.");

            // Constructing strictly formatted Date Objects
            let startDate = new Date(startVal);
            let endDate = new Date(endVal);
            endDate.setHours(23, 59, 59); // Ensure the filter captures the entire final day until 11:59 PM

            // The Filter Loop [A JavaScript mechanism that iterates through an array and mathematically extracts only the items that meet a specific condition]
            let filteredArray = masterLedger.filter(tx => {
                let txDate = new Date(tx.timestamp);
                return txDate >= startDate && txDate <= endDate;
            });

            renderLedgerRows(filteredArray);
        }

        // THE FIX: The Rendering Engine isolated into its own function
        function renderLedgerRows(dataArray) {
            let ledger = document.getElementById("fullLedger");
            ledger.innerHTML = ""; 
            
            if (dataArray.length === 0) {
                ledger.innerHTML = `<div class="tx-row" style="justify-content: center; color: #64748B;">No transfers found in this period.</div>`;
                return;
            }
            
            dataArray.forEach(tx => {
                // THE FIX: Use receiverAcc for pure math, but use the newly resolved tx.sender/tx.receiver names for the UI Display!
                let isIncoming = (tx.receiverAcc === myAccountNumber);
                let iconBg = isIncoming ? "rgba(0, 255, 136, 0.1)" : "rgba(255, 77, 79, 0.1)";
                let iconColor = isIncoming ? "#00ff88" : "#FF4D4F";
                let sign = isIncoming ? "+" : "-";
                let title = isIncoming ? `Transfer from ${tx.sender}` : `Transfer to ${tx.receiver}`;
                let formatRunning = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(tx.runningBalance);
                
                let svgIcon = isIncoming ?
                    `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg>` : 
                    `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline></svg>`;
                
                let formattedAmount = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(tx.amount);
                let safeDesc = tx.description.replace(/'/g, "\\'");
                
                // THE FIX: Upgraded ledger row now displays the Rolling Balance and correctly wires the Receipt accounts!
                ledger.innerHTML += `
                    <div class="tx-row" onclick="openReceipt('${tx.id}', '${tx.timestamp}', '${tx.sender}', '${tx.senderAcc}', '${tx.receiver}', '${tx.receiverAcc}', '${safeDesc}', '${formattedAmount}')" style="cursor: pointer; transition: background 0.2s;">
                        <div class="tx-info">
                            <div class="tx-icon" style="background: ${iconBg}; color: ${iconColor}; flex-shrink: 0;">
                                ${svgIcon}
                            </div>
                            <div class="tx-details">
                                <p>${title}</p>
                                <small style="color: #64748B;">${tx.timestamp} • <span style="color: var(--accent-gold);">${tx.description}</span></small>
                            </div>
                        </div>
                        <div style="text-align: right;">
                            <div class="tx-amount" style="color: ${iconColor}; font-family: 'Inter', monospace; font-weight: 600;">
                                ${sign}${formattedAmount}
                            </div>
                            <small style="color: var(--text-secondary); font-family: 'Inter', monospace;">Bal: ${formatRunning}</small>
                        </div>
                    </div>
                `;
            });
        }

        function downloadReceipt() {
            let receiptDiv = document.getElementById("receiptData");
            html2canvas(receiptDiv, {
                backgroundColor: "#090B10", 
                scale: 2 
            }).then(canvas => {
                let link = document.createElement("a");
                link.download = "DigitalBank_Receipt_" + new Date().getTime() + ".png";
                link.href = canvas.toDataURL("image/png");
                link.click();
            });
        }

        // THE FIX: The Dynamic Back Button Router
        function goBack() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('filter') === 'credit') {
                window.location.assign('./loan.html');
            } else {
                window.location.assign('./home.html');
            }
        }

        // THE FIX: The upgraded Receipt Modal function that resolves Account Numbers alongside Names!
        function openReceipt(id, date, senderName, senderAcc, receiverName, receiverAcc, desc, amount) {
            document.getElementById("recId").innerText = id;
            document.getElementById("recDate").innerText = date;
            
            let isIncoming = (receiverAcc === myAccountNumber);
            
            // THE FIX: Forces the Account Number to physically render on a new line beneath the name using HTML tags!
            document.getElementById("recSender").innerHTML = isIncoming ? `${senderName}<br><span style="color: #94A3B8; font-size: 0.85rem;">Account: ${senderAcc}</span>` : `My Secure Vault<br><span style="color: #94A3B8; font-size: 0.85rem;">Account: ${myAccountNumber}</span>`;
            document.getElementById("recName").innerHTML = isIncoming ? `My Secure Vault<br><span style="color: #94A3B8; font-size: 0.85rem;">Account: ${myAccountNumber}</span>` : `${receiverName}<br><span style="color: #94A3B8; font-size: 0.85rem;">Account: ${receiverAcc}</span>`;
            
            document.getElementById("recDesc").innerText = desc;
            document.getElementById("recAmt").innerText = amount;
            
            document.getElementById("receiptModal").style.display = "flex";
        }

        // THE FIX: The Premium SVG-Branded, Multi-Page, Selectable-Text PDF Engine
        async function downloadPDF() {
            const { jsPDF } = window.jspdf;
            
            // 1. Fetch KYC Data
            let userId = localStorage.getItem("digitalBankId");
            let kyc = await fetch("http://206.189.113.64:8080/api/full-profile", {
                method: "POST", headers: {"Content-Type":"application/json"},
                body: JSON.stringify({googleId: userId})
            }).then(res => res.json());

            // 2. Mathematically Extract Opening and Closing Balances
            let openBal = "$0.00", closeBal = "$0.00";
            if (masterLedger && masterLedger.length > 0) {
                closeBal = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(masterLedger[0].runningBalance);
                let lastTx = masterLedger[masterLedger.length - 1];
                let oldestBal = lastTx.runningBalance;
                if (lastTx.receiverAcc === myAccountNumber) oldestBal -= lastTx.amount;
                else oldestBal += lastTx.amount;
                openBal = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(oldestBal);
            }

            // 3. Setup jsPDF Document
            let doc = new jsPDF('p', 'mm', 'a4');
            let pageWidth = doc.internal.pageSize.getWidth();
            
            // Vector-Draw the Premium Header Background
            doc.setFillColor(26, 29, 36); 
            doc.rect(0, 0, pageWidth, 55, 'F');
            
            // THE FIX: Converting the SVG Logo into a mathematical canvas image and injecting it into the PDF
            await new Promise(resolve => {
                let svgStr = `<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#D4AF37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="12 22 12 8"></polyline><polyline points="9 11 12 8 15 11"></polyline></svg>`;
                let img = new Image();
                img.onload = () => {
                    let canvas = document.createElement('canvas');
                    canvas.width = 40; canvas.height = 40;
                    canvas.getContext('2d').drawImage(img, 0, 0);
                    doc.addImage(canvas.toDataURL('image/png'), 'PNG', 15, 8, 12, 12);
                    resolve();
                };
                img.src = 'data:image/svg+xml;base64,' + btoa(svgStr);
            });
            
            // Institutional Bank Branding
            doc.setTextColor(212, 175, 55); 
            doc.setFontSize(22);
            doc.setFont("helvetica", "bold");
            // Shifted the text to the right (x=30) so it sits perfectly next to the new logo
            doc.text("DigitalBank", 30, 18); 
            
            doc.setTextColor(255, 255, 255);
            doc.setFontSize(10);
            doc.setFont("helvetica", "normal");
            let docTitle = document.getElementById("pageTitle").innerText;
            doc.text(docTitle, 30, 26);
            
            // User KYC Profile Data
            doc.setFontSize(12);
            doc.setFont("helvetica", "bold");
            doc.text(kyc.fullName, 15, 40);
            doc.setFontSize(10);
            doc.setFont("helvetica", "normal");
            doc.setTextColor(200, 200, 200);
            doc.text(`Account: ${kyc.account}`, 15, 46);
            doc.text(`${kyc.address} • ${kyc.country}`, 15, 52);
            
            // Financial Balances (Right-Aligned)
            doc.setTextColor(148, 163, 184);
            doc.text("Opening Balance:", pageWidth - 55, 40);
            doc.setTextColor(255, 255, 255);
            doc.text(openBal, pageWidth - 15, 40, {align: "right"});
            
            doc.setTextColor(148, 163, 184);
            doc.text("Closing Balance:", pageWidth - 55, 48);
            doc.setTextColor(0, 255, 136); 
            doc.setFont("helvetica", "bold");
            doc.text(closeBal, pageWidth - 15, 48, {align: "right"});
            
            // 4. Create Mathematical Table Data
            let tableData = [];
            masterLedger.forEach(tx => {
                let isIncoming = (tx.receiverAcc === myAccountNumber);
                let sign = isIncoming ? "+" : "-";
                let formattedAmount = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(tx.amount);
                let formatRunning = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(tx.runningBalance);
                
                tableData.push([
                    tx.timestamp.split(" ")[0], // Extract Date only
                    tx.id,
                    tx.description,
                    isIncoming ? "Credit" : "Debit",
                    sign + formattedAmount,
                    formatRunning
                ]);
            });

            // 5. Generate Multi-Page AutoTable
            doc.autoTable({
                startY: 65,
                head: [['Date', 'Transaction ID', 'Description', 'Type', 'Amount', 'Balance']],
                body: tableData,
                theme: 'grid',
                headStyles: { fillColor: [212, 175, 55], textColor: [9, 11, 16], fontStyle: 'bold' },
                bodyStyles: { textColor: [50, 50, 50] },
                alternateRowStyles: { fillColor: [245, 245, 245] },
                columnStyles: {
                    4: { halign: 'right', fontStyle: 'bold' },
                    5: { halign: 'right' }
                },
                didParseCell: function (data) {
                    if (data.section === 'body' && data.column.index === 4) {
                        if (data.cell.raw.startsWith('+')) {
                            data.cell.styles.textColor = [0, 150, 50]; // Green
                        } else {
                            data.cell.styles.textColor = [200, 0, 0]; // Red
                        }
                    }
                }
            });
            
            doc.save(`DigitalBank_Statement_${kyc.account}.pdf`);
        }

    </script>
</body>
</html>
